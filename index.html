<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF INTERVENTION PANEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7fb;
  --panel:#ffffff;
  --panel2:#f8fafc;
  --border:#e2e8f0;
  --border2:#cbd5e1;
  --text:#0f172a;
  --muted:#64748b;
  --muted2:#94a3b8;
  --green:#10b981;
  --green2:#059669;
  --green-soft:#ecfdf5;
  --blue:#3b82f6;
  --blue2:#2563eb;
  --blue-soft:#eff6ff;
  --red:#ef4444;
  --red-soft:#fef2f2;
  --amber:#f59e0b;
  --amber-soft:#fffbeb;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.04);
  --shadow-lg:0 4px 12px rgba(15,23,42,.08),0 20px 48px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}
body::before{
  content:"";
  position:fixed;inset:0;
  background:
    radial-gradient(900px 500px at 10% -10%, rgba(16,185,129,.08), transparent 60%),
    radial-gradient(800px 500px at 100% 0%, rgba(59,130,246,.08), transparent 60%),
    radial-gradient(700px 400px at 50% 100%, rgba(16,185,129,.05), transparent 60%);
  pointer-events:none;z-index:0;
}
.grid-bg{
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(15,23,42,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15,23,42,.03) 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;z-index:0;
  mask-image:radial-gradient(ellipse at center, black 40%, transparent 80%);
}

.app{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:24px 20px 40px}

/* TOPBAR */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
  gap:16px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(135deg,var(--green),var(--blue));
  display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:14px;
  box-shadow:0 4px 12px rgba(16,185,129,.3);
  font-family:'JetBrains Mono',monospace;
}
.brand-text{line-height:1.1}
.brand-name{font-weight:800;font-size:16px;letter-spacing:.5px}
.brand-sub{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:2px}
.status-pill{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--border);
  font-size:12px;font-weight:600;
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted2)}
.dot.on{background:var(--green);box-shadow:0 0 0 4px rgba(16,185,129,.15);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* HERO */
.hero{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px 32px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
  position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-60px;top:-60px;
  width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle, rgba(59,130,246,.12), transparent 70%);
}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'JetBrains Mono',monospace;font-size:11px;
  color:var(--green2);font-weight:700;letter-spacing:1.5px;
  padding:6px 12px;border-radius:8px;
  background:var(--green-soft);border:1px solid rgba(16,185,129,.2);
  margin-bottom:14px;
}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
.hero h1 span{background:linear-gradient(120deg,var(--green),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:14px;max-width:620px;line-height:1.6}
.hero-stats{display:flex;gap:28px;margin-top:20px;flex-wrap:wrap}
.hero-stat{display:flex;flex-direction:column}
.hero-stat .v{font-size:22px;font-weight:800;font-family:'JetBrains Mono',monospace}
.hero-stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px}

/* GRID */
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
@media(max-width:980px){.grid{grid-template-columns:1fr}}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  box-shadow:var(--shadow);
  transition:transform .2s,box-shadow .2s;
}
.card:hover{box-shadow:var(--shadow-lg)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
.card-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px}
.card-title .icon{
  width:32px;height:32px;border-radius:10px;
  display:grid;place-items:center;
  background:var(--blue-soft);color:var(--blue2);
  font-size:15px;
}
.card-title .icon.g{background:var(--green-soft);color:var(--green2)}
.card-title .icon.a{background:var(--amber-soft);color:var(--amber)}
.card-title .icon.r{background:var(--red-soft);color:var(--red)}
.card-sub{font-size:12px;color:var(--muted);margin-top:2px}
.badge{
  font-size:10px;font-weight:700;letter-spacing:1px;
  padding:4px 9px;border-radius:6px;
  background:var(--panel2);color:var(--muted);
  border:1px solid var(--border);
  font-family:'JetBrains Mono',monospace;
}
.badge.on{background:var(--green-soft);color:var(--green2);border-color:rgba(16,185,129,.25)}
.badge.off{background:var(--red-soft);color:var(--red);border-color:rgba(239,68,68,.2)}

/* ID INPUT */
.id-block{display:flex;flex-direction:column;gap:12px}
.id-row{display:flex;gap:10px;align-items:stretch}
.id-input{
  flex:1;padding:14px 16px;
  border:1.5px solid var(--border);border-radius:12px;
  background:var(--panel2);color:var(--text);
  font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;
  letter-spacing:1px;outline:none;transition:border .2s,box-shadow .2s;
}
.id-input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(59,130,246,.12);background:#fff}
.id-input::placeholder{color:var(--muted2);font-weight:400;letter-spacing:0}
.btn{
  padding:14px 22px;border:none;border-radius:12px;
  font-weight:700;font-size:14px;cursor:pointer;
  transition:transform .12s,box-shadow .2s,background .2s;
  display:inline-flex;align-items:center;gap:8px;
  font-family:inherit;
}
.btn:active{transform:translateY(1px)}
.btn-primary{
  background:linear-gradient(135deg,var(--green),var(--blue));
  color:#fff;box-shadow:0 6px 16px rgba(16,185,129,.25);
}
.btn-primary:hover{box-shadow:0 8px 20px rgba(16,185,129,.35)}
.btn-ghost{
  background:var(--panel2);color:var(--text);border:1px solid var(--border);
}
.btn-ghost:hover{background:#fff;border-color:var(--border2)}
.btn-danger{background:var(--red-soft);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:8px 14px;font-size:12px;border-radius:9px}

.id-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.id-meta span{display:flex;align-items:center;gap:6px}
.id-meta .k{font-family:'JetBrains Mono',monospace;color:var(--muted2)}

/* TIMER */
.timer-block{display:flex;flex-direction:column;gap:14px}
.timer-display{
  background:linear-gradient(135deg,#0f172a,#1e293b);
  border-radius:14px;padding:
